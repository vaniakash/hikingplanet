<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dumbbell bar -->
  <rect x="22" y="30" width="20" height="4" rx="2" fill="#3D3D3D"/>
  <!-- Left weight plates -->
  <rect x="10" y="22" width="5" height="20" rx="2.5" fill="#F5A623"/>
  <rect x="15" y="25" width="4" height="14" rx="2" fill="#E8941A"/>
  <!-- Right weight plates -->
  <rect x="49" y="22" width="5" height="20" rx="2.5" fill="#F5A623"/>
  <rect x="45" y="25" width="4" height="14" rx="2" fill="#E8941A"/>
  <!-- Heart rate line -->
  <polyline points="4,48 14,48 18,38 22,56 26,44 30,48 34,48 38,42 42,54 46,48 60,48" stroke="#E8303A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Running figure -->
  <circle cx="32" cy="10" r="4" fill="#F5A623"/>
  <path d="M32 14 L28 20 L24 26" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M32 14 L34 21 L38 26" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M28 20 L34 23 L36 28" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
