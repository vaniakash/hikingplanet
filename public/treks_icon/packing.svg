<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Backpack body -->
  <rect x="14" y="18" width="36" height="38" rx="6" fill="#F5A623" opacity="0.9"/>
  <!-- Backpack top -->
  <rect x="20" y="10" width="24" height="12" rx="6" fill="#E8941A"/>
  <!-- Straps -->
  <path d="M20 18 C14 22 14 42 18 52" stroke="#CE7A10" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M44 18 C50 22 50 42 46 52" stroke="#CE7A10" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Front pocket -->
  <rect x="18" y="36" width="28" height="16" rx="4" fill="#E8941A" opacity="0.9"/>
  <!-- Zipper line -->
  <path d="M18 36 Q32 32 46 36" stroke="#CE7A10" stroke-width="1.5" fill="none"/>
  <!-- Zipper pull -->
  <circle cx="32" cy="32" r="2" fill="#CE7A10"/>
  <!-- Top zipper -->
  <path d="M22 18 Q32 14 42 18" stroke="#CE7A10" stroke-width="1.5" fill="none"/>
  <!-- Checklist items on front pocket -->
  <line x1="23" y1="41" x2="41" y2="41" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="23" y1="45" x2="37" y2="45" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="23" y1="49" x2="39" y2="49" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
</svg>
